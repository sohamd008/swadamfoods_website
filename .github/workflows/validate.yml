name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Validate orders D1 migrations locally
        run: npx wrangler d1 migrations apply swadam_orders --local

      - name: Validate inventory D1 schema locally
        run: |
          npx wrangler d1 execute swadam_inventory --local --file=migrations/inventory/0001_inventory.sql
          npx wrangler d1 execute swadam_inventory --local --file=migrations/inventory/0002_finished_stock.sql

      - name: Build Cloudflare worker
        run: npm run build:worker
